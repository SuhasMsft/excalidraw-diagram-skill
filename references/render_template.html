<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    #root { display: inline-block; }
    #root svg { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { exportToSvg } from "https://esm.sh/@excalidraw/utils";

    window.renderDiagram = async function(jsonData) {
      try {
        const data = typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        const elements = data.elements || [];
        const appState = data.appState || {};
        const files = data.files || {};

        // Force white background in appState
        appState.viewBackgroundColor = appState.viewBackgroundColor || "#ffffff";
        appState.exportWithDarkMode = false;

        // @excalidraw/utils changed its signature: the current API is
        //   exportToSvg({ data: { elements, appState, files }, config: { padding } })
        // while older builds took { elements, appState, files } directly.
        // Try the current shape first, fall back to the legacy one.
        const payload = {
          elements: elements,
          appState: { ...appState, exportBackground: true },
          files: files,
        };

        let svg;
        const looksEmpty = (s) =>
          !s || !s.childNodes || s.childNodes.length === 0;

        try {
          svg = await exportToSvg({ data: payload, config: { padding: 16 } });
        } catch (e1) {
          svg = null;
        }
        if (looksEmpty(svg)) {
          // Either the current shape threw, or it returned nothing usable --
          // a silently-empty SVG would otherwise be written out as a blank PNG.
          svg = await exportToSvg(payload);
        }
        if (looksEmpty(svg)) {
          throw new Error("exportToSvg produced an empty SVG under both call shapes");
        }

        // Clear any previous render
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(svg);

        window.__renderComplete = true;
        window.__renderError = null;
        return { success: true, width: svg.getAttribute("width"), height: svg.getAttribute("height") };
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = err.message;
        return { success: false, error: err.message };
      }
    };

    // Signal that the module is loaded and ready
    window.__moduleReady = true;
  </script>
</body>
</html>
